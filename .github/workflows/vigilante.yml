# .github/workflows/vigilante.yml
name: Vigilante Cava

on:
  schedule:
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

jobs:
  vigilar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install yfinance pandas numpy requests

      - name: Ejecutar el vigilante
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python vigilante.py

      - name: Guardar historial y estado (commit automatico)
        run: |
          git config user.name "vigilante-cava"
          git config user.email "vigilante@users.noreply.github.com"
          git add historial_senales.csv estado_vigilante.json 2>/dev/null || true
          git commit -m "Vigilante: actualizacion diaria" 2>/dev/null || echo "sin cambios"
          git push 2>/dev/null || echo "nada que subir"
